# Area labels, applied by .github/workflows/label.yml from the files a PR changes.
api:
  - changed-files:
      - any-glob-to-any-file: include/**

core:
  - changed-files:
      - any-glob-to-any-file: src/**

tests:
  - changed-files:
      - any-glob-to-any-file: test/**

bench:
  - changed-files:
      - any-glob-to-any-file: bench/**

examples:
  - changed-files:
      - any-glob-to-any-file: examples/**

build:
  - changed-files:
      - any-glob-to-any-file:
          - "**/CMakeLists.txt"
          - cmake/**
          - tools/test-install.sh

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - tools/modal_gpu.py

docs:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - docs/**
          - mkdocs.yml
          - Doxyfile
