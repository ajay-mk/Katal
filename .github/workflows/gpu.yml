name: gpu

# Runs the gpu-labelled tests on a Modal T4, the only CI job with a device.
# Pushes to main, every pull request, and manual runs. Every other job here
# only compiles the GPU code. A second run builds and tests as C++23, the
# future target (#35); C++20 is the standard Katal requires.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The C++20 run keeps the plain name gpu-tests.
  gpu-tests:
    name: ${{ matrix.cxx-standard == '20' && 'gpu-tests' || format('gpu-tests (C++{0})', matrix.cxx-standard) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx-standard: ['20', '23']
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      # Secrets cannot appear in a job-level `if`, and a fork's pull request
      # never receives them, so the check is a step. Without the tokens the
      # job passes with a notice rather than failing every PR.
      - name: Check for Modal credentials
        id: modal
        run: |
          if [[ -n "${MODAL_TOKEN_ID}" && -n "${MODAL_TOKEN_SECRET}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::MODAL_TOKEN_ID and MODAL_TOKEN_SECRET are not set; skipping the GPU tests"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.modal.outputs.configured == 'true'

      - uses: actions/setup-python@v7
        if: steps.modal.outputs.configured == 'true'
        with:
          python-version: '3.12'

      - name: Install the Modal client
        if: steps.modal.outputs.configured == 'true'
        run: pip install modal

      - name: Run ctest -L gpu on a T4
        if: steps.modal.outputs.configured == 'true'
        run: modal run tools/modal_gpu.py --cxx-standard ${{ matrix.cxx-standard }}
