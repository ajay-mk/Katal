name: label

# pull_request_target so PRs from forks can be labelled too. This workflow never
# checks out or runs PR code: labeler reads its config from the base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # issues: write lets labeler create a configured label if it is missing.
  issues: write
  pull-requests: write

jobs:
  label:
    name: Label by changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # sync-labels removes area labels whose files are no longer in the diff.
      # It only touches labels named in .github/labeler.yml.
      - uses: actions/labeler@v7
        with:
          sync-labels: true
