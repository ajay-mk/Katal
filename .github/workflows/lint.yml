name: lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Not '3.x': cmake-format (cmakelang) builds an re.Scanner with
      # capturing groups, which Python 3.15 rejects.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-tidy catch2

      # Configure but do not build: the clang-tidy hook needs
      # compile_commands.json and the generated config header, and neither
      # requires compiling anything. clang, not g++, so clang-tidy can replay
      # the command lines.
      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_CXX_COMPILER=clang++

      # Most of this job is clang-format and cmake-format building their hook
      # environments. The python location is in the key because a hook
      # environment is tied to the interpreter that built it.
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{
            hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-

      - run: pip install pre-commit

      - name: Format, include grouping, and naming
        run: pre-commit run --all-files --show-diff-on-failure
