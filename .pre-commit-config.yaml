# commit-msg is not installed by a bare `pre-commit install`; listing it here
# means one `pre-commit install` wires up both stages
default_install_hook_types: [pre-commit, commit-msg]
# without this the file-formatting hooks also run against the commit message
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        # the pinned hook env ships no yaml parser; needed to read .cmake-format.yaml
        additional_dependencies: [pyyaml]

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy (naming)
        language: system
        # Runs over the tests rather than the changed files, because every
        # header is reached through one and headers have no compile command of
        # their own. -header-filter is passed on the command line because
        # HeaderFilterRegex in .clang-tidy is loaded but not applied, which
        # silently leaves every header unchecked.
        entry: >-
          bash -c 'test -f build/compile_commands.json ||
          { echo "configure first: cmake -S . -B build -GNinja"; exit 1; };
          clang-tidy -p build --quiet -header-filter=".*/cuein/.*" test/*.cpp'
        pass_filenames: false
        files: \.(c|cc|cpp|h|hpp|cu|cuh)$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
