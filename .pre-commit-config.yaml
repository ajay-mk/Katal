# without this the formatting hooks would also run against a commit message
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        # the pinned hook env ships no yaml parser; needed to read .cmake-format.yaml
        additional_dependencies: [pyyaml]

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy (naming)
        language: system
        entry: tools/clang-tidy.sh
        pass_filenames: false
        files: \.(c|cc|cpp|h|hpp|cu|cuh)$
