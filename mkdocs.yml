site_name: Katal
site_description: A C++20 einsum front-end for GPU tensor libraries
docs_dir: docs
site_dir: docs-build/site

theme:
  name: material
  logo: assets/katal-mark-dark.svg
  favicon: assets/katal-mark-light.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Building and testing: building.md
  - Equations: equations.md
  - Errors: errors.md
  - Tensor ownership and allocators: tensors.md
  - Examples: examples.md
