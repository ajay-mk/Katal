site_name: cuEin
site_description: A C++20 einsum front-end for NVIDIA cuTENSOR
docs_dir: docs
site_dir: docs-build/site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Examples: examples.md
